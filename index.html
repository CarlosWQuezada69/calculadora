<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Moderna</title>
<style>
/* Reset & Base */
*, *::before, *::after { box-sizing:border-box; }
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#1e1e2f;font-family:"Segoe UI","Roboto",sans-serif;color:#fff;}
.calculator{width:320px;max-width:90vw;padding:20px;border-radius:15px;background:rgba(255,255,255,.07);backdrop-filter:blur(10px);box-shadow:0 4px 30px rgba(0,0,0,.5);display:grid;grid-template-rows:auto 1fr;}
.display{background:#2b2c3a;border-radius:10px;padding:15px;font-size:2.5rem;text-align:right;overflow-x:auto;min-height:60px;}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px;}
button{font-size:1.2rem;padding:20px 0;border:none;border-radius:8px;background:#3a3b4c;color:#fff;cursor:pointer;transition:.2s ease;}
button:hover{background:#4d4e60;}button:active{transform:scale(.95);}
.btn-operator{background:#ff7f50;}
.btn-clear{background:#ff4444;}
.btn-equal{background:#00c853;}
@media(max-width:500px){.calculator{width:90vw;padding:15px;}button{font-size:1rem;padding:15px 0;}}
</style>
</head>
<body>
<div class="calculator" role="application">
  <div class="display" id="display" aria-live="polite"></div>
  <div class="keypad">
    <button class="btn-clear" data-action="clear" aria-label="Reset">C</button>
    <button class="btn-clear" data-action="backspace" aria-label="Delete last digit">CE</button>
    <span></span>
    <button class="btn-operator" data-operation="/" aria-label="Divide">÷</button>

    <button data-value="7" aria-label="Seven">7</button>
    <button data-value="8" aria-label="Eight">8</button>
    <button data-value="9" aria-label="Nine">9</button>
    <button class="btn-operator" data-operation="*" aria-label="Multiply">*</button>

    <button data-value="4" aria-label="Four">4</button>
    <button data-value="5" aria-label="Five">5</button>
    <button data-value="6" aria-label="Six">6</button>
    <button class="btn-operator" data-operation="-" aria-label="Subtract">−</button>

    <button data-value="1" aria-label="One">1</button>
    <button data-value="2" aria-label="Two">2</button>
    <button data-value="3" aria-label="Three">3</button>
    <button class="btn-operator" data-operation="+" aria-label="Add">+</button>

    <button data-value="0" aria-label="Zero">0</button>
    <button data-value="." aria-label="Decimal point">.</button>
    <button data-action="percent" aria-label="Percentage">%</button>
    <button class="btn-equal" data-action="equals" aria-label="Equals">=</button>
  </div>
</div>

<script>
const display=document.getElementById('display');
let current='',op=null,first=null;
function upd(v){display.textContent=v||'0';}
document.querySelectorAll('.keypad button').forEach(b=>{
 b.addEventListener('click',()=>{const a=b.dataset.action,v=b.dataset.value,o=b.dataset.operation;
 if(a==='clear'){reset();}else if(a==='backspace'){bs();}else if(a==='percent'){pct();}else if(a==='equals'){calc();}
 else if(o){setOp(o);}else if(v!==undefined){append(v);}});
});
document.addEventListener('keydown',e=>{
 const k=e.key;
 if(k.match(/[0-9]/)){append(k);}else if(k==='.'){append('.');}
 else if(['+','-','*','/'].includes(k)){setOp(k);} 
 else if(k==='Enter'){calc();} 
 else if(k==='Backspace'){bs();} 
 else if(k.toLowerCase()==='c'){reset();}
});
function append(v){ if(v==='.' && current.includes('.')) return; current+=v; upd(current); }
function setOp(o){ if(current==='' && first===null) return; if(current!==''){ first=parseFloat(current); } op=o; current=''; }
function calc(){if(op===null||current==='')return; const second=parseFloat(current),res=op=='+'?first+second:op=='-'?first-second:op=='*'?first*second:op=='/'&&(second===0?'Error':first/second); upd(res); current=res.toString(); op=null; first=null;}
function reset(){current='';op=null;first=null;upd('0');}
function bs(){if(current.length>0){current=current.slice(0,-1);upd(current||'0');}}
function pct(){if(current==='')return; const n=parseFloat(current),r=n/100; current=r.toString(); upd(current);}upd('0');
</script>
</body>
</html>
